name: Repository secret scan

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out the merged PR or pushed repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Use the supported Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Require complete Git history
        shell: pwsh
        run: |
          $shallow = & git rev-parse --is-shallow-repository
          if ($LASTEXITCODE -ne 0 -or $shallow -ne 'false') {
            throw 'FULL_HISTORY_CHECKOUT_REQUIRED'
          }
      - name: Test forbidden fixtures and scan the worktree and all history
        shell: pwsh
        run: .\contoso-corr-poc\tools\security\Run-SecurityGates.ps1
