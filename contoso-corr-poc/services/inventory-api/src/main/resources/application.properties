server.port=${SERVER_PORT:${PORT:8080}}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.max-http-request-header-size=8KB
server.tomcat.connection-timeout=5s
server.tomcat.threads.max=32
server.tomcat.threads.min-spare=4
server.tomcat.max-connections=128
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
server.error.include-message=never
server.error.include-stacktrace=never
logging.structured.format.console=logstash
logging.structured.json.include=@timestamp,message,level,logger_name,trace_id,span_id,trace_flags,business.invocation_id
logging.level.com.azure=OFF
logging.level.com.microsoft.aad.msal4j=OFF
logging.level.reactor.netty=OFF
logging.level.io.netty=OFF
logging.level.io.lettuce=WARN
logging.level.org.postgresql=WARN
logging.level.org.springframework=WARN
